name: Firebase App Distribution (Android)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Build APK & distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Validate Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get("FIREBASE_SERVICE_ACCOUNT_JSON", "")
          if not raw.strip():
              sys.exit("Missing Actions secret FIREBASE_SERVICE_ACCOUNT")

          try:
              credentials = json.loads(raw)
          except json.JSONDecodeError:
              sys.exit(
                  "FIREBASE_SERVICE_ACCOUNT must be the raw JSON service-account key, "
                  "not base64 or an escaped JSON string"
              )

          required = ("project_id", "private_key", "client_email")
          if credentials.get("type") != "service_account" or any(
              not credentials.get(field) for field in required
          ):
              sys.exit(
                  "FIREBASE_SERVICE_ACCOUNT is not a complete service-account key JSON"
              )

          if not os.environ.get("FIREBASE_APP_ID", "").strip():
              sys.exit("Missing Actions variable FIREBASE_APP_ID")

          print("Firebase App Distribution inputs are present and valid JSON.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::error::Keystore android/app/upload-keystore.jks is missing or empty. Please check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi

      - name: Generate release version info
        id: release_info
        run: |
          RELEASE_DATE=$(date +'%d_%m_%Y')
          VERSION_NAME="videolog_coach_${RELEASE_DATE}"
          APK_NAME="${VERSION_NAME}.apk"
          echo "release_date=${RELEASE_DATE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.release_info.outputs.version_name }}" \
            --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${{ steps.release_info.outputs.apk_name }}"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ vars.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/${{ steps.release_info.outputs.apk_name }}
          releaseNotes: "Release ${{ steps.release_info.outputs.version_name }} (Build #${{ github.run_number }})"
